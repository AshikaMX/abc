     <form action="" method="get" >
        <table border="1" cellspacing="10" cellpadding="20" style="background-color: #e7e9ea;">
            <tr>
                <th colspan="2" style="font-size:larger;"><b> Enquiry Form</b></th>
            </tr>
            <tr>
                <th>
                    <label for="Name">Name:</label>
                </th>
                <td><input type="text" id="name" placeholder="enter your name" required ></td>
            </tr>
            <tr>
                <th><label for="email">Email:</label></th>
                <td><input type="text" id="email" placeholder="enter email address " required></td>
            </tr>
            <tr>
                <th><label for="phone">Phone:</label>
                </th>
                <td><input type="text" id="phone" placeholder="enter phone no." required></td>
            </tr>
            <tr>
                <th><label for="city">city:</label></th>
                <td><select name="city" id="City" required>
                    <option value="">----------Select City---------</option>
                    <option value="Bihar">Bihar</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Jharkhand">Jharkhand</option>
                    <option value="West Bengal">West Bengal</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Uttara Khand">Uttara Khand</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Other">Other</option>
                </select></td>
            </tr>
            <tr>
                <th><label for="Enquiry" >Enquiry type:</label></th>
                <td><select name="Enquiry" id="Enquiry" required>
                    <option value="">------Select Type------</option>
                    <option value="Company Overview">Company Overview</option>
                    <option value="Service Offerings">Service Offerings</option>
                    <option value="Experience and Experties">Experience and Experties</option>
                    <option value="Project-Specific Inquiries">Project-Specific Inquiries</option>
                    <option value="Design Concepts and Styles">Design Concepts and Styles</option>
                    <option value="Timeline and Project Management">Timeline and Project Management</option>
                    <option value="Other Enquiries">Other Enquiries</option>
                </select></td>
            </tr>
            <tr>
                <th><label for="Details">Details:</label></th>
                <td><textarea name="Details" id="Details" placeholder="Detail your enquiry here." required rows="10" ></textarea></td>
            </tr>
        </table>
        <br>
        <input type="submit" value="submit" style="font-size: larger;">
     </form>
